name: Monitor semanal (contratos de credenciamento em PDF)

on:
  schedule:
    # 09:00 America/Sao_Paulo, segundas
    - cron: '0 12 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor-semanal
  cancel-in-progress: false

defaults:
  run:
    working-directory: monitor

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: monitor/package-lock.json

      - run: npm ci

      # Sem Playwright aqui: contrato_credenciamento e sempre PDF via fetch
      # simples (ver fontes.json — tipo_conteudo: "pdf").

      - name: Roda o monitor
        env:
          MONITOR_API_URL: ${{ secrets.MONITOR_API_URL }}
          MONITOR_API_TOKEN: ${{ secrets.MONITOR_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node bin/monitorar.mjs --categoria=contrato_credenciamento

      - name: Salva o estado desta coleta (mesmo se o passo anterior falhou)
        if: always()
        run: |
          git config user.name 'monitor-maquina-certa'
          git config user.email 'monitor@maquinacerta.com.br'
          git add estado
          git diff --cached --quiet || git commit -m "estado(monitor): coleta semanal (contratos de credenciamento) $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
