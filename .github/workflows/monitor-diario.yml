name: Monitor diário (equipamento e cupom)

on:
  schedule:
    # 08:00 America/Sao_Paulo (sem horário de verão hoje)
    - cron: '0 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor-diario
  cancel-in-progress: false

defaults:
  run:
    working-directory: monitor

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: monitor/package-lock.json

      - run: npm ci

      - name: Instala navegador para fontes que exigem JavaScript
        run: npx playwright install --with-deps chromium

      - name: Roda o monitor
        env:
          MONITOR_API_URL: ${{ secrets.PORTAL_API_URL }}
          MONITOR_API_TOKEN: ${{ secrets.COLETA_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node bin/monitorar.mjs --categoria=equipamento_cupom

      - name: Salva o estado desta coleta (mesmo se o passo anterior falhou)
        if: always()
        run: |
          git config user.name 'monitor-maquina-certa'
          git config user.email 'monitor@maquinacerta.com.br'
          git add estado
          git diff --cached --quiet || git commit -m "estado(monitor): coleta diária (equipamento/cupom) $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
