name: Monitor — resumo semanal no Telegram

on:
  schedule:
    # 08:30 America/Sao_Paulo, segundas
    - cron: '30 11 * * 1'
  workflow_dispatch: {}

defaults:
  run:
    working-directory: monitor

jobs:
  resumo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: monitor/package-lock.json

      - run: npm ci

      - name: Envia o resumo semanal
        env:
          MONITOR_API_URL: ${{ secrets.PORTAL_API_URL }}
          MONITOR_API_TOKEN: ${{ secrets.COLETA_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node bin/resumo-semanal.mjs
